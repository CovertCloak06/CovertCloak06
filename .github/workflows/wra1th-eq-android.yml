name: Wra1th EQ Android CI

on:
  push:
    branches:
      - 'claude/**'
      - main
    paths:
      - 'wra1th-eq/**'
      - '.github/workflows/wra1th-eq-android.yml'
  workflow_dispatch:

concurrency:
  group: wra1th-eq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit-test, assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wra1th-eq

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile instrumentation tests (no emulator on this runner)
        run: ./gradlew :app:assembleDebugAndroidTest --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wra1th-eq-debug-apk
          path: wra1th-eq/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wra1th-eq-test-reports
          path: |
            wra1th-eq/app/build/reports/tests/
            wra1th-eq/app/build/test-results/
          if-no-files-found: ignore
