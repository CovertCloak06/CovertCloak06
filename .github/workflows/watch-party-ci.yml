name: Watch Party CI

on:
  push:
    paths:
      - "watch-party/**"
      - ".github/workflows/watch-party-ci.yml"
  pull_request:
    paths:
      - "watch-party/**"
      - ".github/workflows/watch-party-ci.yml"

defaults:
  run:
    working-directory: watch-party

concurrency:
  group: watch-party-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit + integration tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: watch-party/package-lock.json
      - run: npm ci
      - name: Build shared package
        run: npm run build -w @watch-party/shared
      - name: Injected player script is up to date
        run: npm run check:generated -w @watch-party/shared
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests (memory + Redis)
        run: npm test
      - name: Build server and extension
        run: npm run build

  e2e:
    name: Browser end-to-end sync tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: watch-party/package-lock.json
      - name: Install ffmpeg (generates the harness test video)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build -w @watch-party/shared
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: watch-party/apps/server
      - name: Sync e2e (in-memory store)
        run: npm run test:e2e -w @watch-party/server
        env:
          CI: "1"
      - name: Sync e2e (Redis store + adapter)
        run: npm run test:e2e -w @watch-party/server
        env:
          CI: "1"
          E2E_REDIS_URL: redis://127.0.0.1:6379
          E2E_PORT: "8789"
      - name: Extension e2e
        run: npm run test:e2e -w @watch-party/extension
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            watch-party/apps/server/test-results
            watch-party/apps/extension/test-results
          retention-days: 7

  mobile:
    name: Expo bundle check
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: watch-party/package-lock.json
      - run: npm ci
      - run: npm run build -w @watch-party/shared
      - name: expo-doctor
        run: npx expo-doctor
        working-directory: watch-party/apps/mobile
      - name: Bundle Android and iOS JavaScript
        run: |
          npx expo export --platform android --output-dir /tmp/expo-android
          npx expo export --platform ios --output-dir /tmp/expo-ios
        working-directory: watch-party/apps/mobile

  docker:
    name: Server Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t watch-party-server .
      - name: Boot the image and probe health
        run: |
          docker run -d --name wp -p 8080:8080 \
            -e SESSION_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e ALLOW_FIXTURE_CATALOG=1 watch-party-server
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then exit 0; fi
            sleep 1
          done
          docker logs wp
          exit 1
